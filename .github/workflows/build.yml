name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      AMPP_RELEASE_STORE_FILE: ${{ github.workspace }}/am-plus-plus-release.jks
      AMPP_RELEASE_STORE_PASSWORD: ${{ secrets.AMPP_RELEASE_STORE_PASSWORD }}
      AMPP_RELEASE_KEY_ALIAS: ${{ secrets.AMPP_RELEASE_KEY_ALIAS }}
      AMPP_RELEASE_KEY_PASSWORD: ${{ secrets.AMPP_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned glass renderer
        run: python3 scripts/verify-glass-reference.py

      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          AMPP_RELEASE_KEYSTORE_BASE64: ${{ secrets.AMPP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AMPP_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$AMPP_RELEASE_STORE_FILE"

      - name: Build and test release
        if: github.event_name != 'pull_request'
        run: |
          chmod +x gradlew
          ./gradlew test :app:lintDebug :app:lintVitalRelease :glass:lintDebug :glass-lab:lintDebug :app:assembleRelease :glass-lab:assembleDebug :glass-lab:assembleDebugAndroidTest --no-daemon

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        run: |
          verification="$($ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)"
          printf '%s\n' "$verification"
          printf '%s\n' "$verification" | grep -q 'Verified using v2 scheme.*: true'
          if printf '%s\n' "$verification" | grep -q 'CN=Android Debug'; then
            echo 'Refusing to publish an APK signed with the Android debug certificate.' >&2
            exit 1
          fi

      - name: Build and test pull request
        if: github.event_name == 'pull_request'
        run: |
          chmod +x gradlew
          ./gradlew test :app:lintDebug :app:lintVitalRelease :glass:lintDebug :glass-lab:lintDebug :app:assembleDebug :glass-lab:assembleDebug :glass-lab:assembleDebugAndroidTest --no-daemon

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload pull request APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload glass comparison APKs
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-glass-lab
          path: |
            glass-lab/build/outputs/apk/debug/glass-lab-debug.apk
            glass-lab/build/outputs/apk/androidTest/debug/glass-lab-debug-androidTest.apk
          if-no-files-found: error
